[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lite6"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["xarm-python-sdk", "numpy", "scipy", "pyyaml"]

[tool.setuptools]
packages = ["lite6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
